services:
  db:
    image: postgres:18-alpine
    container_name: ghana-health-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghana_health
      POSTGRES_PASSWORD: ghana_health_dev
      POSTGRES_DB: ghana_health_ai
    ports:
      - "5437:5432"
    volumes:
      - ghana_health_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghana_health -d ghana_health_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ghana_health_pg:
